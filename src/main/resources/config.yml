# ============================================================
#  CleanGangHub — configuration
#  Les textes utilisent MiniMessage : <gold>, <bold>, <#ff00aa>, <gradient:...>
# ============================================================

prefix: "<dark_gray>[<gradient:#7ee8fa:#eec0c6>CleanGang</gradient><dark_gray>] "

# Monde "hub" : là où on renvoie les joueurs quand un monde est déchargé
# (id d'un monde de /world list, ou clé complète comme minecraft:overworld)
hub-world: "minecraft:overworld"

# Format des dates dans /world info
time-format: "dd/MM/yyyy HH:mm"

# ------------------------------------------------------------
#  MONDES — tout se gère en jeu avec /world (voir /world help)
#  La liste des mondes est dans worlds.yml.
#  Sur Paper 26.x, un monde "poulet" est rangé dans
#     world/dimensions/cleangang/poulet/
# ------------------------------------------------------------

# Relier les portails selon nether-world / end-world / normal-world de chaque monde
world-link-enabled: true

# Déchargement automatique des mondes vides (flag auto-unload-enabled par monde)
auto-unload:
  enabled: true
  check-interval: 60   # secondes entre deux vérifications
  delay: 1800          # secondes sans joueur avant déchargement
  load-delay: 300      # un monde chargé depuis moins longtemps n'est jamais déchargé

# Valeurs par défaut des flags (pour chaque monde qui ne les redéfinit pas)
world-defaults:
  auto-load-enabled: true
  auto-unload-enabled: false
  difficulty: NORMAL           # appliqué seulement si défini sur le monde
  game-mode: SURVIVAL
  force-game-mode: "false"     # true | false | false-with-permission
  hunger-enabled: true
  nether-portal-accessible: true
  end-portal-accessible: true
  nether-world: the_nether
  end-world: the_end
  normal-world: overworld
  pvp-enabled: true
  receive-achievements: true
  redstone-enabled: true
  spawn-animals: true
  spawn-monsters: true
  spawn-entities: true
  weather-enabled: true
  whitelist-enabled: false

# ------------------------------------------------------------
#  LIVRE-CARTE
# ------------------------------------------------------------
book:
  name: "<gradient:#ffd36e:#ff8a3d><bold>Carte du monde</bold></gradient>"
  lore:
    - "<gray>Clic droit pour ouvrir la carte"
  give-on-join: true
  slot: 8            # emplacement dans la hotbar (0-8)
  locked: true       # impossible à jeter / perdu à la mort
  item-model: ""     # ex: "cleangang:carte" si tu fais une texture dans ton resource pack

# ------------------------------------------------------------
#  CARTE (GUI)
#  layout = dessin de la carte, 1 ligne = 1 rangée de 9 cases
#  legend = lettre -> matériau. Utilise des LETTRES uniquement.
# ------------------------------------------------------------
map:
  title: "<dark_gray>✦ Carte de CleanGang ✦"
  rows: 6
  background: LIGHT_BLUE_STAINED_GLASS_PANE
  layout:
    - "OOOSGGSOO"
    - "OOSGFFGSO"
    - "OSGGMMFGS"
    - "OSGFMMGGS"
    - "OOSGGGSOO"
    - "OOOOSSOOO"
  legend:
    O: LIGHT_BLUE_STAINED_GLASS_PANE
    S: YELLOW_STAINED_GLASS_PANE
    G: LIME_STAINED_GLASS_PANE
    F: GREEN_STAINED_GLASS_PANE
    M: GRAY_STAINED_GLASS_PANE

  clouds:
    enabled: true
    mode: center        # center (s'ouvre depuis le milieu) | left (de gauche à droite) | random
    tick-interval: 2    # vitesse : ticks entre chaque étape (20 = 1 seconde)
    spread: 1.4         # plus grand = ouverture plus lente/étalée
    randomness: 2.5     # irrégularité du bord des nuages
    materials:          # nuages épais (dérivent doucement vers la droite)
      - WHITE_STAINED_GLASS_PANE
      - WHITE_STAINED_GLASS_PANE
      - WHITE_STAINED_GLASS_PANE
      - LIGHT_GRAY_STAINED_GLASS_PANE
    thin: GLASS_PANE    # nuage qui se dissipe, juste avant de révéler la case

  games-button:
    enabled: true
    slot: 53
    icon: COMPASS
    name: "<gold><bold>Mini-jeux"
    lore:
      - "<gray>Ouvre le menu des modes de jeu"

# ------------------------------------------------------------
#  TÉLÉPORTATION
# ------------------------------------------------------------
teleport:
  delay-ticks: 20       # temps "dans les nuages" avant la TP
  title: "<white>☁ ☁ ☁"

# ------------------------------------------------------------
#  MENU MINI-JEUX
#  world = monde de destination (spawn du monde)
#  point = (optionnel) id d'un point de la carte à utiliser à la place du spawn
# ------------------------------------------------------------
games-menu:
  title: "<dark_gray>Mini-jeux CleanGang"
  rows: 3
  filler: BLACK_STAINED_GLASS_PANE
  back-button:
    slot: 22
    icon: BOOK
    name: "<yellow>← Retour à la carte"

games:
  poulet:
    name: "<yellow><bold>Find The Poulet"
    icon: FEATHER
    slot: 11
    world: poulet
    lore:
      - "<gray>Attrape le poulet et ramène-le"
      - "<gray>à ton enclos !"
  blockhunt:
    name: "<aqua><bold>BlockHunt"
    icon: GRASS_BLOCK
    slot: 13
    world: blockhunt
    lore:
      - "<gray>Cache-toi en bloc… ou chasse !"
  flip7:
    name: "<light_purple><bold>Flip 7"
    icon: PAPER
    slot: 15
    world: flip7
    lore:
      - "<gray>Le jeu de cartes, autour d'une table"
